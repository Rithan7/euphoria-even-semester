<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - PSGCAS Euphoria</title>
  <!-- Elegant fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=EB+Garamond:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'EB Garamond', serif; /* elegant, readable */
      color: #d4af37;
      
    }
    .video-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  z-index: -1; /* ensures it's behind content */
}

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: rgba(0,0,0,0.75);
      border: 2px solid #c0c0c0;
      border-radius: 12px;
      box-shadow: 0 0 20px #00f0ff, inset 0 0 40px #c0c0c0;
    }
    h1 {
      font-family: 'Cinzel Decorative', serif;
      text-align: center;
      color: #c0c0c0;
      text-shadow: 0 0 15px #c0c0c0, 0 0 25px #00f0ff;
    }
    label {
      display: block;
      margin: 12px 0 6px;
      color: #d4af37;
      font-family: 'EB Garamond', serif;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 2px solid #c0c0c0;
      border-radius: 6px;
      background: #111;
      color: #fff;
      font-family: 'EB Garamond', serif;
    }
    .checkbox-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #111;
      padding: 8px;
      border: 1px solid #c0c0c0;
      border-radius: 6px;
      cursor: pointer;
      color: #d4af37;
      font-family: 'EB Garamond', serif;
    }
    .checkbox-group label:hover {
      background: #1a1a1a;
      box-shadow: 0 0 10px #00f0ff;
    }
    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: 2px solid #c0c0c0;
      border-radius: 8px;
      background: transparent;
      color: #c0c0c0;
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.3s ease;
    }
    button:hover {
      background: #00f0ff;
      color: #000;
      box-shadow: 0 0 20px #00f0ff, 0 0 40px #c0c0c0;
      transform: scale(1.1);
    }
    .team-section {
      display: none;
      margin-top: 20px;
    }
    .team-section h3 {
      font-family: 'Cinzel Decorative', serif;
      color: #c0c0c0;
      text-shadow: 0 0 10px #c0c0c0, 0 0 20px #00f0ff;
    }
  </style>
</head>
<body>
  
  <div class="container">
    <h1>Event Registration</h1>
    <form action="/register" method="POST">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" required>

      <label for="collegeName">College Name</label>
      <input type="text" id="collegeName" name="collegeName" required>

      <label for="department">Department</label>
      <input type="text" id="department" name="department" required>

      <label for="yearOfStudy">Year of Study</label>
      <select id="yearOfStudy" name="yearOfStudy" required>
        <option value="I">I</option>
        <option value="II">II</option>
        <option value="III">III</option>
        <option value="IV">IV</option>
      </select>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone Number</label>
      <input type="text" id="phone" name="phone" required>

      <label>Events (Select multiple)</label>
      <div class="checkbox-group">
        <h1>OFF STAGE EVENTS</h1>
        <BR>
        <label><input type="checkbox" name="events" value="Brain-BOX" data-type="individual">Brain-Box</label>
        <label><input type="checkbox" name="events" value="Bliss Quiz" data-type="group" data-members="2">Bliss Quiz</label>
        <label><input type="checkbox" name="events" value="Tamilodu Vilayadu" data-type="individual">Tamilodu Vilayadu</label>
        <label><input type="checkbox" name="events" value="Kitchen Clash" data-type="group" data-members="2">Kitchen Clash(cook with flame)</label>
        <label><input type="checkbox" name="events" value="Art Attack" data-type="individual">Art Attack</label>
        <label><input type="checkbox" name="events" value="Mock United Nations" data-type="individual">Mock United Nations</label>
        <label><input type="checkbox" name="events" value="Beyond the Pitch" data-type="group" data-members="2">Beyond the Pitch:Football Saga</label>
        <label><input type="checkbox" name="events" value="Clash Of Clans" data-type="group" data-members="2">Clash Of Clans</label>
        <label><input type="checkbox" name="events" value="Lens Legacy" data-type="group" data-members="3">Lens Legacy(videography)</label>
        <label><input type="checkbox" name="events" value="Pitch Bazar" data-type="group" data-members="3">Pitch Bazar</label>
        <label><input type="checkbox" name="events" value="Survive the Upside Down" data-type="group" data-members="3"> Survive the Upside Down (Group, 3 members)</label>
        <label><input type="checkbox" name="events" value="IPL Auction" data-type="group" data-members="4">IPL Auction</label>
        <label><input type="checkbox" name="events" value="CineFesto" data-type="group" data-members="3">Cinefesto</label>
        <label><input type="checkbox" name="events" value="Treasure Hunt" data-type="group" data-members="3">Treasure Hunt</label>
        <label><input type="checkbox" name="events" value="The Mind Spark" data-type="individual">The Mind Spark(Extempore)</label>
        <label><input type="checkbox" name="events" value="FIFA League" data-type="individual">FIFA League(E-Sports)</label>
        <label><input type="checkbox" name="events" value="Murder Mystery" data-type="group" data-members="3">Murder Mystery</label>
        <label><input type="checkbox" name="events" value="Chess" data-type="individual">Chess</label>
        <label><input type="checkbox" name="events" value="Bitzinct" data-type="group" data-members="3">Biztinct</label>
        <label><input type="checkbox" name="events" value="Beat The Budget" data-type="group" data-members="2">Beat The Budget</label>
        <label><input type="checkbox" name="events" value="Tamilodu Vilayadu" data-type="individual">Tamilodu Vilayadu</label>
        <br>
        <h1>ON STAGE EVENTS</h1>
        <br>
        <label><input type="checkbox" name="events" value="Beyond The Step" data-type="individual">Beyond The Step(solo Dance)</label>
        <label><input type="checkbox" name="events" value="Note By Note" data-type="individual">Note By Note(Solo Singing)</label>
        <label><input type="checkbox" name="events" value="Ignite X" data-type="group" data-members="8">Ignite X(Group Dance)</label>
        <label><input type="checkbox" name="events" value="Euphoria's Got Talent" data-type="group" data-members="8">Euphoria's Got Talent (Variety Entertainment)</label>
        <label><input type="checkbox" name="events" value="Spotlight Suffle" data-type="individual">SpotLight Suffle (Adapt Tunes) </label>
        <label><input type="checkbox" name="events" value="Battle Of The Bands" data-type="group" data-members="10">Battle Of The Bands(Band)</label>
      </div>

      <!-- Team member details -->
      <div class="team-section" id="teamSection">
        <h3>Team Members</h3>
        <div id="teamInputs"></div>
      </div>

      <button type="submit">Register</button>
    </form>
  </div>

  <script>
    const checkboxes = document.querySelectorAll('input[name="events"]');
    const teamSection = document.getElementById('teamSection');
    const teamInputs = document.getElementById('teamInputs');

    checkboxes.forEach(cb => {
      cb.addEventListener('change', () => {
        const groupEvent = Array.from(checkboxes).find(c => c.checked && c.dataset.type === 'group');
        if (groupEvent) {
          teamSection.style.display = 'block';
          teamInputs.innerHTML = "";
          const members = parseInt(groupEvent.dataset.members);
          for (let i = 1; i <= members; i++) {
            teamInputs.innerHTML += `
              <label for="member${i}">Member ${i} Name</label>
              <input type="text" id="member${i}" name="member${i}">
            `;
          }
        } else {
          teamSection.style.display = 'none';
          teamInputs.innerHTML = "";
        }
      });
    });
  </script>
</body>
</html>
