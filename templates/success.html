<!DOCTYPE html>

  <style>
    body {
      margin: 0;
      font-family: 'Pirata One', cursive;
      background: url("/static/images/blackpearl.png") left center no-repeat,
                  url("/static/images/pirates.png") right center no-repeat,
                  #000;
      background-size: contain, contain;
      color: gold;
      text-align: center;
      padding-top: 100px;
